name: inception

services:
  wordpress:
    build: 
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    networks:
      - my-network
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    networks:
      - my-network
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    env_file:
      - ".env"
    volumes:
      - mariadb_data:/var/lib/mysql

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    networks:
      - my-network
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
      - mariadb

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/iduman/wordpress
      o: bind
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/iduman/mariadb
      o: bind

networks:
  my-network:
    driver: bridge
    name: my-network

